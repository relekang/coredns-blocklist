name: Build release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag
        required: true
        type: string
      sha:
        description: Full commit SHA for the draft release
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      sha:
        required: true
        type: string

jobs:
  releases-matrix:
    name: Build Go Binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux]
        goarch: ["386", amd64, arm, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27
      - name: Build artifact
        run: |
          go build -o coredns example/main.go
          zip "coredns-with-blocklist-${{ matrix.goos }}-${{ matrix.goarch }}" coredns
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Store artifact
        uses: actions/upload-artifact@v7
        with:
          name: coredns-with-blocklist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: coredns-with-blocklist-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: releases-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coredns-with-blocklist-*
          merge-multiple: true
          path: artifacts
      - name: Upload assets and publish release
        run: |
          test "$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$TAG_NAME" --json targetCommitish --jq .targetCommitish)" = "$RELEASE_SHA"
          gh release upload "$TAG_NAME" artifacts/*.zip --clobber
          gh release edit "$TAG_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_SHA: ${{ inputs.sha }}
